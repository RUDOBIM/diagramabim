<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIMLoading · Estudio de diagramas</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#202a29;background:#e7eae4}header{background:#162524;color:#eff5ea;display:flex;justify-content:space-between;align-items:center;padding:16px 25px;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header span{color:#b1c6bf;margin-left:12px}main{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{background:#f9faf6;padding:22px;border-right:1px solid #c9d1cb}h1{font-size:24px;line-height:1.05;margin:0 0 16px}h2{font-size:14px;margin:20px 0 10px}label{display:block;font-size:13px;margin:8px 0}input:not([type=checkbox]),select{width:100%;margin-top:4px;border:1px solid #b7c3bc;border-radius:5px;padding:7px;color:inherit;background:white}input[type=range]{padding:0;accent-color:#007963}input[type=checkbox]{accent-color:#007963}button{border:1px solid #879c92;background:#fff;color:#20312b;border-radius:6px;padding:8px 11px;font:inherit;cursor:pointer}button.primary,button[aria-pressed=true]{background:#00705b;border-color:#00705b;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stage{padding:20px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:12px}.sheet{background:#faf9f3;border:1px solid #bac7bf;border-radius:10px;overflow:hidden}.sheet svg{display:block;width:100%;height:auto}.foot{font-size:13px;color:#41524c}.map{width:100%;height:420px;border:0}.map[hidden],.sheet[hidden]{display:none}a{color:#006a55}.volumes{display:grid;gap:5px}.volumes button{text-align:left}output{font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #bd571f;outline-offset:2px}@media(max-width:750px){main{display:flex;flex-direction:column}.stage{order:-1;padding:12px}aside{border-right:0}}
</style>
</head>
<body>
<header><div><strong>BIMLoading</strong><span>Estudio de diagramas</span></div><div><button id="svg">Exportar SVG</button> <button id="png" class="primary">Exportar PNG</button></div></header>
<main>
<aside aria-label="Parámetros del proyecto">
<h1>Configura el sitio</h1>
<label>Nombre del proyecto<input id="title" maxlength="70" value="Pabellón de acceso"></label>
<div class="row"><label>Latitud<input id="lat" type="number" min="-85" max="85" step="0.0001" value="19.4326"></label><label>Longitud<input id="lon" type="number" min="-180" max="180" step="0.0001" value="-99.1332"></label></div>
<label>Desfase UTC (horas)<input id="utc" type="number" min="-12" max="14" step="0.25" value="-6"></label>
<h2>Volúmenes</h2>
<div id="volumes" class="volumes"></div>
<div class="row" id="dimensions"></div>
<div class="row"><button id="add">Añadir</button><button id="remove">Eliminar</button></div>
<h2>Sol y sombras</h2>
<label>Fecha<input id="date" type="date" value="2026-06-21"></label>
<label>Hora local <output id="hourText"></output><input id="hour" type="range" min="0" max="23.75" step="0.25" value="15"></label>
<label><input id="shadow" type="checkbox" checked> Mostrar sombras</label>
<h2>Símbolos</h2>
<label><input id="trees" type="checkbox" checked> Vegetación</label>
<label><input id="access" type="checkbox" checked> Acceso peatonal</label>
<label><input id="north" type="checkbox" checked> Norte</label>
</aside>
<section class="stage" aria-label="Vista del proyecto">
<nav class="toolbar" aria-label="Vistas">
<button data-view="iso" aria-pressed="true">Axonometría</button>
<button data-view="plan" aria-pressed="false">Planta</button>
<button data-view="map" aria-pressed="false">Mapa de contexto</button>
</nav>
<div class="sheet" id="sheet"></div>
<iframe class="map" id="map" title="Mapa de contexto de OpenStreetMap" loading="lazy" hidden></iframe>
<p class="foot" id="status" role="status"></p>
<p class="foot">Estudio conceptual. Sombras aproximadas sobre terreno plano.</p>
</section>
</main>
<script type="module" src="./src.js"></script>
</body>
</html>
